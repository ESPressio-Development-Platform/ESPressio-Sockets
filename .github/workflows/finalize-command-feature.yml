name: Finalize Command Feature

on:
  push:
    branches: [feature/command-socket-integration]
    paths: ['.github/workflows/finalize-command-feature.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-socket-integration

      - name: Update release metadata and documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # library.json
          p = Path('library.json')
          data = json.loads(p.read_text())
          data['version'] = '0.3.0'
          data['description'] = 'Socket-based ESPressio transports, Command invocation adapters, and Timing synchronization providers for ESP32.'
          data['keywords'] = 'esp32,sockets,udp,tcp,tls,websocket,mqtt,event,command,cli,transport,network,timing,clock,synchronization,sntp,espressio'
          p.write_text(json.dumps(data, indent=4) + '\n')

          # library.properties
          p = Path('library.properties')
          s = p.read_text()
          s = s.replace('version=0.2.3', 'version=0.3.0')
          s = s.replace('sentence=Socket-based Event Transport and System Clock synchronization implementations for the ESPressio ecosystem.',
                        'sentence=Socket-based Event Transport, Command invocation, and System Clock synchronization for the ESPressio ecosystem.')
          s = s.replace('paragraph=Provides UDP, TCP, TLS, WebSocket and MQTT Event transports plus opt-in ESPressio Timing System Clock synchronization over UDP, TCP, WebSocket and SNTP.',
                        'paragraph=Provides UDP, TCP, TLS, WebSocket and MQTT Event transports, opt-in TCP ESPressio Command invocation, and opt-in ESPressio Timing System Clock synchronization.')
          p.write_text(s)

          # component.mk
          p = Path('component.mk')
          s = p.read_text()
          s = s.replace('ESPRESSIO_SOCKETS_VERSION_MINOR=2', 'ESPRESSIO_SOCKETS_VERSION_MINOR=3')
          s = s.replace('ESPRESSIO_SOCKETS_VERSION_PATCH=3', 'ESPRESSIO_SOCKETS_VERSION_PATCH=0')
          s = s.replace('ESPRESSIO_SOCKETS_VERSION_STRING=\\"0.2.3\\"', 'ESPRESSIO_SOCKETS_VERSION_STRING=\\"0.3.0\\"')
          p.write_text(s)

          # umbrella guidance (do not batch-include optional Command dependency)
          p = Path('src/ESPressio_Sockets.hpp')
          s = p.read_text()
          marker = ''' * Timing synchronization is likewise opt-in through:\n *\n *   ESPressio_SocketClockSynchronization.hpp\n *\n * This keeps ESPressio Event/Serializable and ESPressio Timing dependencies\n * opt-in at the consuming-code level.\n'''
          replacement = ''' * Timing synchronization is likewise opt-in through:\n *\n *   ESPressio_SocketClockSynchronization.hpp\n *\n * Command invocation is opt-in through:\n *\n *   ESPressio_SocketCommandSession.hpp\n *   ESPressio_TCPCommandServer.hpp\n *\n * This keeps ESPressio Event/Serializable, ESPressio Timing, and ESPressio\n * Command dependencies opt-in at the consuming-code level.\n'''
          if marker in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s)

          # changelog
          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## 0.3.0 — 2026-08-20\n\n### Added\n- Added opt-in ESPressio Command 0.2.x integration for remote Command invocation over sockets.\n- Added host-testable `SocketCommandSession` with line-oriented and structured-binary request modes.\n- Added `TCPCommandServer` with isolated per-client Command sessions.\n- Added request/connection metadata, policy hooks, result observers, correlation IDs, bounded request handling, and structured request/response framing.\n- Added a TCP Command server example and comprehensive host tests for Command framing, dispatch, validation, session isolation, policy and error paths.\n- Added a permanent GitHub Actions host-test workflow pinned to released ESPressio dependencies.\n\n### Changed\n- Updated package/component version metadata to 0.3.0.\n- Updated README and ESPressio dependency documentation for optional Command integration.\n- Expanded host regression testing to retain coverage of the existing socket clock-synchronization protocol.\n\n### Compatibility\n- Core ESPressio Sockets remains independent of ESPressio Command.\n- Existing Event Transport and Timing synchronization APIs remain source-compatible.\n- ESPressio Command is required only when Command integration headers are selected.\n\n'''
          if '## 0.3.0' not in s:
              s = s.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
          p.write_text(s)

          # README current version and Command section
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('The current repository version is **0.2.3**.', 'The current repository version is **0.3.0**.', 1)
          s = s.replace('ESPressio Sockets `0.2.3` targets', 'ESPressio Sockets `0.3.0` targets', 1)
          command_section = r'''

# Command Invocation over Sockets

Version 0.3.0 adds opt-in integration with **ESPressio Command >= 0.2.0 < 1.0.0**.

Core Sockets does **not** require ESPressio Command. Include Command integration only where remote Command invocation is required:

```cpp
#include <ESPressio_TCPCommandServer.hpp>
```

PlatformIO:

```ini
lib_deps =
    flowduino/ESPressio-Sockets@^0.3.0
    flowduino/ESPressio-Command@^0.2.0
```

The dependency direction remains:

```text
ESPressio Sockets core
    -> no Command dependency

Socket Command integration
    - - -> ESPressio Command >= 0.2.0 < 1.0.0
```

## Command architecture

```text
TCP client
    |
    v
TCPCommandServer
    |
    +-- per-client SocketCommandSession
    +-- framing / bounded buffering
    +-- connection metadata
    +-- policy / result hooks
    |
    v
ESPressio CommandRegistry
    |
    v
typed Command callback
    |
    v
CommandResult
    |
    v
originating TCP client
```

`SocketCommandSession` is transport-neutral at the byte-stream boundary and is host-testable independently of Wi-Fi. `TCPCommandServer` binds an independent session to each accepted `WiFiClient`.

## Line-oriented mode

Line mode is suitable for interactive clients such as `nc`, telnet-style terminals, or simple custom controllers:

```text
gpio write 2 high
system status
```

Each newline-delimited request is resolved by ESPressio Command and produces one response:

```text
OK 0 System OK
ERR 1 Unknown command 'example'
```

Both LF and CRLF input are accepted. Quoting and escaping are delegated to ESPressio Command's text parser.

Example configuration:

```cpp
#include <ESPressio_Command.hpp>
#include <ESPressio_TCPCommandServer.hpp>

using namespace ESPressio;

Sockets::TCPCommandServer commandServer;

void setup() {
    auto& registry = Command::CommandRegistry::GetInstance();

    registry.Command("system")
        .Command("status")
        .OnExecute([](const Command::CommandContext&) {
            return Command::CommandResult::Ok("System OK");
        });

    Sockets::TCPCommandServerConfig config;
    config.Port = 2323;
    config.MaximumClients = 4;
    config.Session.Mode = Sockets::SocketCommandMode::Line;
    config.Session.MaximumRequestBytes = 512;

    commandServer.Initialize(config, registry);
}
```

The consuming application remains responsible for establishing Wi-Fi/network connectivity before initializing the server.

## Structured-binary mode

Machine-to-machine clients can avoid manufacturing command-line text by sending a structured `CommandInvocation` representation.

The version-1 request carries:

```text
request/correlation ID
Command path
positional parameters
named parameters
raw caller metadata string
```

The response carries:

```text
matching request/correlation ID
success/failure
CommandResult code
CommandResult message
```

Structured payloads use an explicit 32-bit length prefix and an ESPressio-owned binary format. This mode intentionally does **not** require ESPressio Serializable or JSON.

Helpers are exposed through:

```cpp
#include <ESPressio_SocketCommandProtocol.hpp>
```

including:

```cpp
SocketCommandProtocol::EncodeRequest(...)
SocketCommandProtocol::DecodeRequest(...)
SocketCommandProtocol::EncodeResponse(...)
SocketCommandProtocol::DecodeResponse(...)
SocketCommandProtocol::FrameStructuredPayload(...)
```

## Per-client session isolation

`TCPCommandServer` allocates an independent `SocketCommandSession` for every connected client. Partial lines, structured frame state, request IDs, and protocol errors therefore cannot leak between clients.

The maximum number of clients remains bounded by both `MaximumClients` and `ESPRESSIO_SOCKETS_MAX_TCP_CLIENTS`.

## Request limits and protocol errors

`SocketCommandSessionConfig` provides:

```text
Mode
MaximumRequestBytes
DisconnectOnProtocolError
IgnoreEmptyLines
```

Input accumulation is bounded by `MaximumRequestBytes`. Oversized line requests are discarded through the next newline and the session then recovers for subsequent commands. Structured frames declare their length before payload processing and are rejected when the declared size exceeds the configured limit.

## Connection metadata and policy

Every socket Command invocation is associated with `SocketCommandMetadata`:

```text
Transport
RemoteAddress
RemotePort
SessionID
RequestID
```

`TCPCommandServer` populates TCP connection metadata automatically.

Applications can install a policy hook:

```cpp
commandServer.SetPolicy(
    [](const Sockets::SocketCommandInvocationContext& context) {
        if (context.Metadata.RemoteAddress != "192.168.1.50") {
            return Command::CommandResult::Error("Remote client not permitted", 403);
        }

        return Command::CommandResult::Ok();
    }
);
```

This provides an authorization/rate-limiting/audit boundary without putting application semantics into ESPressio Sockets.

A result observer can inspect completed invocations:

```cpp
commandServer.SetResultObserver(
    [](const Sockets::SocketCommandInvocationContext& context,
       const Command::CommandResult& result) {
        // audit / diagnostics
    }
);
```

## Command vs Event over sockets

Command and Event transports are complementary rather than interchangeable:

```text
Command
    remote caller asks the device to do something

Event
    a device reports that something happened
```

A typical architecture can therefore receive a Command over TCP and subsequently emit an Event describing the resulting state change.
'''
          if '# Command Invocation over Sockets' not in s:
              s += command_section
          p.write_text(s)

          # dependency chart
          p = Path('ESPRESSIO_DEPENDENCY_CHART.md')
          s = p.read_text()
          s = s.replace('ESPressio Sockets 0.2.3', 'ESPressio Sockets 0.3.0')
          section = r'''

## ESPressio Sockets → ESPressio Command — opt-in

Sockets 0.3.0 adds optional remote Command invocation through `SocketCommandSession` and `TCPCommandServer`.

```text
ESPressio Sockets core
    -> no required ESPressio Command dependency

Socket Command integration
    - - -> ESPressio Command >= 0.2.0 < 1.0.0
```

The integration provides byte-stream framing, per-client state, connection/request metadata, policy hooks, and `CommandResult` response transport. Command definition, parsing, validation, routing and callback execution remain owned by ESPressio Command.

The structured binary protocol is implemented directly by Sockets and does not introduce a Serializable dependency.
'''
          if 'ESPressio Sockets → ESPressio Command' not in s:
              s += section
          p.write_text(s)
          PY

      - name: Add TCP Command example
        run: |
          mkdir -p examples/TCPCommandServer
          cat > examples/TCPCommandServer/TCPCommandServer.ino <<'EOF'
          #include <WiFi.h>
          #include <ESPressio_Command.hpp>
          #include <ESPressio_TCPCommandServer.hpp>

          using namespace ESPressio;

          constexpr char WiFiSSID[] = "YOUR_SSID";
          constexpr char WiFiPassword[] = "YOUR_PASSWORD";

          Sockets::TCPCommandServer CommandServer;

          void setup() {
              Serial.begin(115200);
              WiFi.begin(WiFiSSID, WiFiPassword);
              while (WiFi.status() != WL_CONNECTED) delay(100);

              auto& commands = Command::CommandRegistry::GetInstance();
              commands.Command("system")
                  .Command("status")
                  .OnExecute([](const Command::CommandContext&) {
                      return Command::CommandResult::Ok("System OK");
                  });

              auto& write = commands.Command("gpio").Command("write");
              write.Parameter<int>("pin").Range(0, 48);
              write.Parameter<bool>("state");
              write.OnExecute([](const Command::CommandContext& context) {
                  const int pin = context.Get<int>("pin");
                  const bool state = context.Get<bool>("state");
                  pinMode(pin, OUTPUT);
                  digitalWrite(pin, state ? HIGH : LOW);
                  return Command::CommandResult::Ok("GPIO updated");
              });

              Sockets::TCPCommandServerConfig config;
              config.Port = 2323;
              config.MaximumClients = 4;
              config.Session.Mode = Sockets::SocketCommandMode::Line;
              config.Session.MaximumRequestBytes = 512;
              config.Session.DisconnectOnProtocolError = false;

              CommandServer.SetPolicy(
                  [](const Sockets::SocketCommandInvocationContext& context) {
                      Serial.printf(
                          "Command session=%llu remote=%s:%u request=%llu raw=%s\n",
                          static_cast<unsigned long long>(context.Metadata.SessionID),
                          context.Metadata.RemoteAddress.c_str(),
                          context.Metadata.RemotePort,
                          static_cast<unsigned long long>(context.Metadata.RequestID),
                          context.Invocation.raw.c_str()
                      );
                      return Command::CommandResult::Ok();
                  }
              );

              if (!CommandServer.Initialize(config, commands)) {
                  Serial.println("TCP Command server failed to initialize");
              } else {
                  Serial.printf("TCP Command server listening on port %u\n", config.Port);
              }
          }

          void loop() {
              delay(1000);
          }
          EOF

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- library.json library.properties component.mk src/ESPressio_Sockets.hpp CHANGELOG.md README.md ESPRESSIO_DEPENDENCY_CHART.md examples/TCPCommandServer/TCPCommandServer.ino
          git commit -m "docs: prepare Sockets 0.3.0 Command integration" || true
          git push origin HEAD:feature/command-socket-integration
