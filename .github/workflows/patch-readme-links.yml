name: Patch README Links

on:
  push:
    branches: [feature/command-socket-integration]
    paths: ['.github/workflows/patch-readme-links.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-socket-integration
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('The current repository version is **0.2.3**.', 'The current repository version is **0.3.0**.', 1)
          s = s.replace('ESPressio Sockets `0.2.3` targets', 'ESPressio Sockets `0.3.0` targets', 1)
          s = s.replace('flowduino/ESPressio-Sockets@^0.2.3', 'flowduino/ESPressio-Sockets@^0.3.0')
          marker = 'and therefore the Serializable support used by ESPressio Event Transport.\n'
          addition = '\nCommand invocation is also opt-in and targets **ESPressio Command >= 0.2.0 < 1.0.0**. See [Command Integration](COMMAND_INTEGRATION.md) for the TCP server, line/structured protocols, session metadata, policy hooks, limits, and examples.\n'
          if addition.strip() not in s and marker in s:
              s = s.replace(marker, marker + addition, 1)
          p.write_text(s)

          p = Path('ESPRESSIO_DEPENDENCY_CHART.md')
          s = p.read_text()
          section = '\n\n## ESPressio Sockets → ESPressio Command — opt-in\n\nSockets 0.3.0 optionally consumes **ESPressio Command >= 0.2.0 < 1.0.0** when `SocketCommandSession` or `TCPCommandServer` is selected. Core Sockets remains independent of Command. The integration owns socket framing, bounded per-client state, connection/request metadata and result transport; ESPressio Command continues to own Command definition, typed parsing/validation, routing and callback execution. The structured socket protocol does not require ESPressio Serializable.\n'
          if 'ESPressio Sockets → ESPressio Command — opt-in' not in s:
              s += section
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md ESPRESSIO_DEPENDENCY_CHART.md
          git commit -m "docs: align Sockets 0.3.0 Command integration"
          git push origin HEAD:feature/command-socket-integration
