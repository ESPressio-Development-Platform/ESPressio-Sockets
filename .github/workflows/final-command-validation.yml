name: Final Command Validation
on:
  push:
    branches: [feature/command-socket-integration]
    paths: ['.github/workflows/final-command-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/command-socket-integration

      - name: Tighten Command session and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # The policy used by the structured multi-request test should validate
          # the metadata contract, not hard-code the first request ID forever.
          p = Path('tests/test_socket_command.cpp')
          s = p.read_text()
          s = s.replace(
              '            assert(context.Metadata.RequestID == 42);\n            assert(context.Invocation.path.size() == 2);',
              '            assert(context.Metadata.RequestID >= 42 && context.Metadata.RequestID <= 44);\n            assert(context.Invocation.path.size() == 2);',
              1
          )

          # Add an explicit unknown-command assertion before the first test block closes.
          marker = '        assert(AsString(output) == "ERR 403 remote policy denied\\n");\n    }\n\n    {\n        Command::CommandRegistry registry;'
          replacement = '''        assert(AsString(output) == "ERR 403 remote policy denied\\n");\n\n        session.SetPolicy({});\n        session.SetResultObserver({});\n        output.clear();\n        const char* unknown = "does-not-exist\\n";\n        assert(session.Feed(reinterpret_cast<const uint8_t*>(unknown), std::strlen(unknown)));\n        assert(AsString(output).find("ERR 1 Unknown command") == 0);\n    }\n\n    {\n        Command::CommandRegistry registry;'''
          if marker not in s:
              raise SystemExit('unknown-command test insertion point missing')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)

          # Make DisconnectOnProtocolError meaningful at the session boundary:
          # protocol errors still emit an error response, but return false when
          # the caller requested disconnection.
          p = Path('src/ESPressio_SocketCommandSession.hpp')
          s = p.read_text()
          old = '''                    success = WriteLineResult(Command::CommandResult::Error("Command exceeds maximum request length")) && success;\n                    continue;'''
          new = '''                    const bool wrote = WriteLineResult(Command::CommandResult::Error("Command exceeds maximum request length"));\n                    if (_config.DisconnectOnProtocolError) return false;\n                    success = wrote && success;\n                    continue;'''
          if old not in s:
              raise SystemExit('line protocol-error path missing')
          s = s.replace(old, new, 1)

          old = '''                    _structured.clear();\n                    _expectedStructuredBytes = 0;\n                    return EmitStructuredError(0, "Structured Command frame exceeds configured limit");'''
          new = '''                    _structured.clear();\n                    _expectedStructuredBytes = 0;\n                    const bool wrote = EmitStructuredError(0, "Structured Command frame exceeds configured limit");\n                    return _config.DisconnectOnProtocolError ? false : wrote;'''
          if old not in s:
              raise SystemExit('structured protocol-error path missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Add explicit disconnect-policy tests.
          p = Path('tests/test_socket_command.cpp')
          s = p.read_text()
          marker = '''    {\n        // Protocol rejects truncation, invalid magic/version and malformed response state.'''
          block = '''    {\n        Command::CommandRegistry registry;\n        registry.Command("ping").OnExecute([](const Command::CommandContext&) {\n            return Command::CommandResult::Ok("pong");\n        });\n        Sockets::SocketCommandSessionConfig config;\n        config.MaximumRequestBytes = 4;\n        config.DisconnectOnProtocolError = true;\n        std::vector<uint8_t> output;\n        Sockets::SocketCommandSession session;\n        assert(session.Initialize(registry, config, {}, [&](const uint8_t* d, std::size_t n) {\n            output.insert(output.end(), d, d + n);\n            return true;\n        }));\n        const char* oversized = "12345\\n";\n        assert(!session.Feed(reinterpret_cast<const uint8_t*>(oversized), std::strlen(oversized)));\n        assert(AsString(output) == "ERR 1 Command exceeds maximum request length\\n");\n    }\n\n'''
          if marker not in s:
              raise SystemExit('disconnect test insertion point missing')
          s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/ESPressio_SocketCommandSession.hpp tests/test_socket_command.cpp
          git commit -m "test: tighten socket Command protocol coverage"
          git push origin HEAD:feature/command-socket-integration

      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Command
          ref: 0.2.0
          path: deps/ESPressio-Command
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Timing
          ref: 2.2.2
          path: deps/ESPressio-Timing
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Units
          ref: 0.2.1
          path: deps/ESPressio-Units
      - uses: actions/checkout@v4
        with:
          repository: Flowduino/ESPressio-Observable
          ref: 3.0.1
          path: deps/ESPressio-Observable

      - name: Validate and report
        shell: bash
        run: |
          set +e
          {
            cmake -S tests -B build \
              -DESPRESSIO_COMMAND_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Command/src" \
              -DESPRESSIO_TIMING_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Timing/src" \
              -DESPRESSIO_UNITS_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Units/src" \
              -DESPRESSIO_OBSERVABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Observable/src"
            c1=$?; echo "configure_exit=$c1"
            if [ $c1 -eq 0 ]; then cmake --build build --parallel; c2=$?; else c2=99; fi
            echo "build_exit=$c2"
            if [ $c1 -eq 0 ] && [ $c2 -eq 0 ]; then ctest --test-dir build --output-on-failure; c3=$?; else c3=99; fi
            echo "test_exit=$c3"
          } > final-validation.txt 2>&1
          cat final-validation.txt
          mkdir -p .ci
          mv final-validation.txt .ci/final-command-validation.txt
          git add -- .ci/final-command-validation.txt
          git commit -m "chore: record final socket Command validation"
          git push origin HEAD:feature/command-socket-integration
