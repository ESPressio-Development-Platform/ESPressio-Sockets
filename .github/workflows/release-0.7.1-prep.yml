name: Prepare Sockets 0.7.1 release
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'release/24-0.7.1-repository-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/24-0.7.1-repository-relocation
      - name: Prepare release documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['README.md','COMMAND_INTEGRATION.md','SECURITY_INTEGRATION.md']
          reps=[('## Current Version — 0.7.0','## Current Version — 0.7.1'),('Sockets 0.7.0','Sockets 0.7.1'),('ESPressio Observable >= 3.0.1 < 4.0.0','ESPressio Observable >= 3.0.2 < 4.0.0'),('Observable >= 3.0.1 < 4.0.0','Observable >= 3.0.2 < 4.0.0'),('Event >= 6.0.0 < 7.0.0','Event >= 6.0.1 < 7.0.0'),('Command >= 1.0.0 < 2.0.0','Command >= 1.0.1 < 2.0.0'),('Security >= 0.3.0 < 1.0.0','Security >= 0.3.1 < 1.0.0'),('Timing >= 2.2.4 < 3.0.0','Timing >= 2.2.5 < 3.0.0'),('ESPressio-Sockets@^0.7.0','ESPressio-Sockets@^0.7.1'),('ESPressio-Observable@^3.0.1','ESPressio-Observable@^3.0.2'),('ESPressio-Event@^6.0.0','ESPressio-Event@^6.0.1'),('ESPressio-Command@^1.0.0','ESPressio-Command@^1.0.1'),('ESPressio-Security@^0.3.0','ESPressio-Security@^0.3.1'),('ESPressio-Timing@^2.2.4','ESPressio-Timing@^2.2.5')]
          for f in files:
              p=Path(f)
              if not p.exists(): continue
              t=p.read_text()
              for a,b in reps: t=t.replace(a,b)
              p.write_text(t)
          p=Path('CHANGELOG.md'); t=p.read_text(); entry='''## 0.7.1 — 2026-08-22\n\n### Changed\n- Published the post-migration ESPressio Sockets package generation from `ESPressio-Development-Platform`.\n- Raised required Observable to `>=3.0.2 <4.0.0`.\n- Raised optional Event to `>=6.0.1 <7.0.0`, Command to `>=1.0.1 <2.0.0`, Security to `>=0.3.1 <1.0.0`, and Timing to `>=2.2.5 <3.0.0`.\n- Updated package metadata, integration documentation, CI validation, and dependency documentation.\n\n### Compatibility\n- No Sockets public API, protocol-v1 wire format, or runtime behaviour changes are introduced by this repository-relocation patch release.\n\n''';
          if '## 0.7.1' not in t: t=t.replace('# Changelog\n\n','# Changelog\n\n'+entry,1)
          p.write_text(t)
          reps2=[('Observable    3.0.1','Observable    3.0.2'),('Observable 3.0.1','Observable 3.0.2'),('Serializable  0.10.2','Serializable  0.10.3'),('Serializable 0.10.2','Serializable 0.10.3'),('Units         0.2.3','Units         0.2.4'),('Units 0.2.3','Units 0.2.4'),('Timing        2.2.4','Timing        2.2.5'),('Timing 2.2.4','Timing 2.2.5'),('Threads       3.1.4','Threads       3.1.5'),('Threads 3.1.4','Threads 3.1.5'),('Event         6.0.0','Event         6.0.1'),('Event 6.0.0','Event 6.0.1'),('Command       1.0.0','Command       1.0.1'),('Command 1.0.0','Command 1.0.1'),('Security      0.3.0','Security      0.3.1'),('Security 0.3.0','Security 0.3.1'),('Sockets       0.7.0','Sockets       0.7.1'),('Sockets 0.7.0','Sockets 0.7.1'),('Observable >= 3.0.1','Observable >= 3.0.2'),('Event >= 6.0.0','Event >= 6.0.1'),('Command >= 1.0.0','Command >= 1.0.1'),('Security >= 0.3.0','Security >= 0.3.1'),('Timing >= 2.2.4','Timing >= 2.2.5')]
          for f in ['ESPRESSIO_DEPENDENCY_CHART.md','ESPRESSIO_DEPENDENCY_CHART.svg']:
              p=Path(f); t=p.read_text()
              for a,b in reps2: t=t.replace(a,b)
              p.write_text(t)
          PY
      - name: Commit release preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md CHANGELOG.md ESPRESSIO_DEPENDENCY_CHART.md ESPRESSIO_DEPENDENCY_CHART.svg COMMAND_INTEGRATION.md SECURITY_INTEGRATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prepare Sockets 0.7.1 release documentation (#24)'
          git push
