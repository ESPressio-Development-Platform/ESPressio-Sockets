name: Apply strict socket adapter formatting fix

on:
  push:
    branches: [primitives_redesign]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: primitives_redesign
      - name: Expand warning-ambiguous statements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/ESPressio_SocketAdapterTransport.hpp')
          s = p.read_text()
          replacements = {
              '        if(payloadBytes) std::memcpy(_tx.data()+SocketAdapterWire::HeaderBytes,payload,payloadBytes); frameBytes=SocketAdapterWire::HeaderBytes+payloadBytes; return true;': '        if(payloadBytes) {\n            std::memcpy(_tx.data()+SocketAdapterWire::HeaderBytes,payload,payloadBytes);\n        }\n        frameBytes=SocketAdapterWire::HeaderBytes+payloadBytes;\n        return true;',
              '        if(!available) MarkSessionPendingUnavailable(*session); if(!AdvanceSessionGeneration(*session)){ session->Available=false; return false; }': '        if(!available) {\n            MarkSessionPendingUnavailable(*session);\n        }\n        if(!AdvanceSessionGeneration(*session)){ session->Available=false; return false; }',
              '        if(_txBusy.test_and_set(std::memory_order_acquire)) return {Adapters::LowerTransportDisposition::TemporarilyUnavailable,_generation,false}; FlagGuard tx(_txBusy);': '        if(_txBusy.test_and_set(std::memory_order_acquire)) {\n            return {Adapters::LowerTransportDisposition::TemporarilyUnavailable,_generation,false};\n        }\n        FlagGuard tx(_txBusy);',
              '        if(!_active.load(std::memory_order_acquire)) return {SocketAdapterFeedStatus::NotRunning,0}; auto* session=FindSession(route);': '        if(!_active.load(std::memory_order_acquire)) {\n            return {SocketAdapterFeedStatus::NotRunning,0};\n        }\n        auto* session=FindSession(route);',
              '        if(session->RxBusy.test_and_set(std::memory_order_acquire)) return {SocketAdapterFeedStatus::Busy,0}; FlagGuard guard(session->RxBusy); return {ProcessFrame(*session,bytes,size),size};': '        if(session->RxBusy.test_and_set(std::memory_order_acquire)) {\n            return {SocketAdapterFeedStatus::Busy,0};\n        }\n        FlagGuard guard(session->RxBusy);\n        return {ProcessFrame(*session,bytes,size),size};',
              '        if((!bytes&&size)||session->RxBusy.test_and_set(std::memory_order_acquire)) return {SocketAdapterFeedStatus::Busy,0}; FlagGuard guard(session->RxBusy); std::size_t consumed=0;': '        if((!bytes&&size)||session->RxBusy.test_and_set(std::memory_order_acquire)) {\n            return {SocketAdapterFeedStatus::Busy,0};\n        }\n        FlagGuard guard(session->RxBusy);\n        std::size_t consumed=0;',
              '            if(!receipt.Used||!receipt.Ready) continue; auto* session=FindSession(receipt.Route);': '            if(!receipt.Used||!receipt.Ready) continue;\n            auto* session=FindSession(receipt.Route);',
              '            if(_txBusy.test_and_set(std::memory_order_acquire)) return false; FlagGuard tx(_txBusy);': '            if(_txBusy.test_and_set(std::memory_order_acquire)) return false;\n            FlagGuard tx(_txBusy);',
              '            if(!pending.Used||!pending.Ready) continue; if(pending.TransportGeneration!=_generation){ pending=OutboundPending{}; return true; }': '            if(!pending.Used||!pending.Ready) continue;\n            if(pending.TransportGeneration!=_generation){ pending=OutboundPending{}; return true; }',
          }
          for old, new in replacements.items():
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'expected formatting target not found: {old[:60]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git rm .github/workflows/r9-socket-format-fix.yml
      - name: Commit formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ESPressio_SocketAdapterTransport.hpp
          git commit -m "Fix strict socket adapter diagnostics"
          git push origin HEAD:primitives_redesign
