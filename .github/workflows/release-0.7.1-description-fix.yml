name: Correct Sockets 0.7.1 release description
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'release/24-0.7.1-repository-relocation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/24-0.7.1-repository-relocation
      - name: Correct current release description
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md'); t=p.read_text()
          old="Sockets 0.7.1 adds compatibility with ESPressio Command 1.0.0's typed `CommandInvocation` values while preserving the existing Socket Command protocol-v1 wire representation. The Sockets core remains modular: Event, Command, Security, and Timing integrations are selected explicitly."
          new="Sockets 0.7.1 is the repository-relocation dependency patch for the Sockets 0.7 generation. It validates the migrated ESPressio dependency stack while preserving the existing Socket Command protocol-v1 wire representation and modular opt-in Event, Command, Security, and Timing integrations."
          t=t.replace(old,new,1); p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct Sockets 0.7.1 release description (#24)'
          git push
