name: Host Tests

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sockets
        uses: actions/checkout@v4
      - name: Verify family-neutral Sockets boundary
        shell: bash
        run: |
          if grep -nE '#[[:space:]]*include[[:space:]]*[<\"]ESPressio_(Event|Command|State|SocketEvent|SocketCommand|SocketState|SocketWorkerEventBridge|SocketSecuritySessionEventBridge)' src/ESPressio_Sockets.hpp; then
            echo 'Core Sockets umbrella must remain family-neutral.' >&2
            exit 1
          fi
          for file in \
            src/ESPressio_SocketEventFrame.hpp \
            src/ESPressio_SocketEvents.hpp \
            src/ESPressio_SocketWorkerEventBridge.hpp \
            src/ESPressio_SocketWorkerEvents.hpp \
            src/ESPressio_SocketSecuritySessionEventBridge.hpp \
            src/ESPressio_SocketSecuritySessionEvents.hpp \
            src/ESPressio_SocketCommandProtocol.hpp \
            src/ESPressio_SocketCommandSession.hpp \
            src/ESPressio_SocketCommandTypes.hpp \
            src/ESPressio_TCPCommandServer.hpp \
            src/ESPressio_SocketState.hpp \
            src/ESPressio_SocketStateFrame.hpp \
            src/ESPressio_SocketStateSession.hpp \
            src/ESPressio_TCPStateClient.hpp \
            src/ESPressio_TCPStateServer.hpp; do
            if test -e "$file"; then
              echo "Superseded family stack remains: $file" >&2
              exit 1
            fi
          done
      - name: Verify package metadata matches neutral boundary
        shell: bash
        run: |
          grep -q '"name": "ESPressio-System"' library.json
          grep -q '"name": "ESPressio-Observable"' library.json
          grep -q '^depends=ESPressio-System,ESPressio-Observable$' library.properties
          if grep -Ei 'PubSubClient|Event Transport|Command invocation|State sessions' library.json library.properties; then
            echo 'Sockets package metadata reintroduced a removed family transport/dependency claim.' >&2
            exit 1
          fi
          if grep -E '#(structural_realignment|main)("|$)' library.json; then
            echo 'Sockets redesign dependency references must remain on primitives_redesign.' >&2
            exit 1
          fi
      - name: Checkout ESPressio System working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: deps/ESPressio-System
      - name: Checkout ESPressio Security working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Security
          ref: primitives_redesign
          path: deps/ESPressio-Security
      - name: Checkout ESPressio Timing working branch
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: deps/ESPressio-Timing
      - name: Checkout ESPressio Units
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: deps/ESPressio-Units
      - name: Checkout ESPressio Observable
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: primitives_redesign
          path: deps/ESPressio-Observable
      - name: Configure
        run: >-
          cmake -S tests -B build
          -DESPRESSIO_SYSTEM_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-System/src"
          -DESPRESSIO_SECURITY_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Security/src"
          -DESPRESSIO_TIMING_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Timing/src"
          -DESPRESSIO_UNITS_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Units/src"
          -DESPRESSIO_OBSERVABLE_INCLUDE_DIR="$GITHUB_WORKSPACE/deps/ESPressio-Observable/src"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
